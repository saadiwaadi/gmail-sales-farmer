<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Bitlogic Hub CRM</title>
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root {
      --bg: #090A0F;
      --bg-card: rgba(22, 23, 27, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --accent: #5B8DEF;
      --accent-glow: rgba(91, 141, 239, 0.15);
      --accent-gradient: linear-gradient(135deg, #5B8DEF 0%, #8F6FE0 100%);
      --error: #E2585E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(91, 141, 239, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(143, 111, 224, 0.08) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 24px 0;
      position: relative;
    }

    /* Abstract shapes in background */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.5;
    }
    .shape-1 {
      width: 300px;
      height: 300px;
      background: #5B8DEF;
      top: -50px;
      left: -50px;
      animation: float 20s infinite alternate;
    }
    .shape-2 {
      width: 400px;
      height: 400px;
      background: #8F6FE0;
      bottom: -100px;
      right: -100px;
      animation: float 25s infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 30px) scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 450px;
      padding: 24px;
      z-index: 1;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: center;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(91, 141, 239, 0.3);
    }

    .brand-logo svg {
      width: 22px;
      height: 22px;
      fill: #FFF;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFF 30%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-text {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-text h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .header-text p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 15px;
      transition: all 0.25s ease;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    select.form-control {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
      background-repeat: no-repeat;
      background-position: calc(100% - 12px) center;
      background-size: 18px;
      padding-right: 40px;
    }

    select.form-control option {
      background: #16171B;
      color: var(--text);
    }

    .btn {
      width: 100%;
      background: var(--accent-gradient);
      border: none;
      border-radius: 12px;
      padding: 15px;
      color: #FFF;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(91, 141, 239, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91, 141, 239, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-box {
      background: rgba(226, 88, 94, 0.1);
      border: 1px solid rgba(226, 88, 94, 0.2);
      color: var(--error);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .footer-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .footer-link a:hover {
      text-decoration: underline;
      color: #79A3F2;
    }

    /* Loading Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="container">
    <div class="card">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="brand-title">Bitlogic Hub</div>
      </div>

      <div class="header-text">
        <h1>Create Account</h1>
        <p>Register as a team member</p>
      </div>

      <div class="error-box" id="errorBox">
        <svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorText">Failed to sign up.</span>
      </div>

      <form id="signupForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input class="form-control" type="text" id="name" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-control" type="email" id="email" required placeholder="john@company.com">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" required placeholder="••••••••">
          </div>

          <div class="form-group">
            <label class="form-label" for="role">Role</label>
            <select class="form-control" id="role">
              <option value="Agent">Agent</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 26px;">
          <label class="form-label" for="key">Registration Setup Key</label>
          <input class="form-control" type="password" id="key" required placeholder="Enter server setup key">
        </div>

        <button class="btn" type="submit" id="submitBtn">
          <span id="btnText">Sign Up</span>
          <div class="spinner" id="btnSpinner"></div>
        </button>
      </form>

      <div class="footer-link">
        Already have an account? <a href="/login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'block';

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const key = document.getElementById('key').value;

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role, key })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.error || 'Signup failed. Please try again.');
        }

        window.location.href = '/';
      } catch (err) {
        errorText.textContent = err.message;
        errorBox.style.display = 'flex';
        submitBtn.disabled = false;
        btnText.style.display = 'block';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
